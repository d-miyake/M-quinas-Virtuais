<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Máquinas Virtuais: A Saga</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:'Press Start 2P','Courier New',monospace;color:#fff;-webkit-tap-highlight-color:transparent}
#g{position:absolute;left:50%;top:50%;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#5c94fc;user-select:none}
.sc{position:absolute;inset:0;display:none;overflow:hidden}.sc.on{display:block}
.s{position:absolute;image-rendering:pixelated}
.sky{position:absolute;inset:0;background:linear-gradient(#4a86f0,#9fd0ff 70%,#cfeaff)}
.cl{position:absolute;width:110px;height:34px;background:#fff;border-radius:20px;box-shadow:30px -14px 0 4px #fff,60px 2px 0 #fff;animation:dr 40s linear infinite}
@keyframes dr{from{transform:translateX(-200px)}to{transform:translateX(1150px)}}
.hill{position:absolute;bottom:90px;background:#2fb52f;border:4px solid #0a5a0a;border-radius:90px 90px 0 0;box-shadow:inset -18px 0 #1d8a1d}
.hill:before,.hill:after{content:"";position:absolute;top:30%;width:8px;height:22px;background:#000;border-radius:3px;left:38%}.hill:after{left:56%}
.gr{position:absolute;left:0;right:0;bottom:0;height:90px;background:radial-gradient(#e0a050 2px,transparent 3px) 0 0/16px 16px,linear-gradient(#3fc83f 0 12px,#0a5a0a 12px 16px,#c8843c 16px);background-color:#c8843c}
.q{position:absolute;width:64px;height:64px;background:#f8b800;border:4px solid #000;box-shadow:inset 4px 4px #ffe070,inset -4px -4px #b87000;font-size:34px;line-height:56px;text-align:center;color:#fff;text-shadow:3px 3px #000}
.q.hit{transform:translateY(-14px)}.q.used{background:#a0602a;box-shadow:inset 4px 4px #c88040,inset -4px -4px #603010;color:transparent}
.bob{animation:bob .3s steps(2) infinite}@keyframes bob{50%{transform:translateY(-4px)}}
.btn{font:inherit;font-size:13px;color:#fff;background:#e52521;border:4px solid #000;box-shadow:inset 0 -6px #9c0f0c,inset 0 4px #ff6a60,5px 5px 0 #0006;padding:12px 16px;cursor:pointer;text-shadow:2px 2px #000}
.btn:hover{filter:brightness(1.2)}.btn:active{transform:translate(3px,3px)}.btn.b{background:#2038ec;box-shadow:inset 0 -6px #10208a,inset 0 4px #6a80ff,5px 5px 0 #0006}.btn.y{background:#f8b800;color:#000;text-shadow:none;box-shadow:inset 0 -6px #b87000,inset 0 4px #ffe070,5px 5px 0 #0006}
.btn:disabled{opacity:.35;cursor:default;filter:none}
#f{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:50}
#logo{position:absolute;right:10px;top:10px;z-index:40;background:#fff;border:4px solid #000;border-radius:6px;padding:4px 8px;box-shadow:3px 3px #0005}#logo img{display:block;width:110px}
#mu{position:absolute;left:10px;top:10px;z-index:40;font-size:16px;background:#000a;border:3px solid #fff;color:#fff;padding:6px 8px;cursor:pointer}
.ttl{font-size:44px;line-height:54px;text-align:center;text-shadow:4px 4px #000;-webkit-text-stroke:2px #000;paint-order:stroke fill}
.c0{color:#f83838}.c1{color:#18c8f8}.c2{color:#f8c818}.c3{color:#18c818}
/* title */
#ttl{position:absolute;left:0;right:0;top:50px;opacity:0;transform:translateY(200px) scale(.1);transition:all .7s cubic-bezier(.2,1.3,.4,1)}#ttl.show{opacity:1;transform:none}
#ttl small{display:block;font-size:22px;margin-top:6px}
#sb{position:absolute;left:50%;top:350px;transform:translateX(-50%);font-size:18px;opacity:0;pointer-events:none;transition:opacity .4s}#sb.show{opacity:1;pointer-events:auto;animation:pul 1s steps(2) infinite}
@keyframes pul{50%{margin-top:-6px}}
.cred{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:9px;line-height:15px;color:#fff;text-shadow:2px 2px #000;padding:0 130px}
/* map */
.sea{position:absolute;inset:0;background:repeating-linear-gradient(#3a7bf0 0 14px,#4a8cff 14px 18px)}
.isl{position:absolute;left:60px;top:70px;width:840px;height:400px;background:#58c830;border:14px solid #c8843c;border-radius:50px;box-shadow:inset 0 0 0 6px #3fa020}
.nd{position:absolute;width:46px;height:46px;border:5px solid #000;border-radius:50%;cursor:pointer;background:#888;display:flex;align-items:center;justify-content:center;font-size:18px}
.nd.open{background:#f8d818;animation:pul 1s steps(2) infinite}.nd.done{background:#e52521;animation:none}.nd.lock{filter:grayscale(1);cursor:not-allowed}.nd.pop{animation:pp .6s}
@keyframes pp{0%{transform:scale(0)}70%{transform:scale(1.5)}100%{transform:scale(1)}}
.lb{position:absolute;width:210px;text-align:center;font-size:9px;line-height:14px;background:#000b;padding:5px;border:2px solid #fff;transform:translateX(-50%);pointer-events:none}
.arw{position:absolute;font-size:20px;color:#f00;text-shadow:2px 2px #000;animation:pul .6s steps(2) infinite;pointer-events:none}
.hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:9px;text-shadow:2px 2px #000}
/* lesson */
.box{position:absolute;background:#fff8e0;color:#222;border:5px solid #000;box-shadow:inset 0 0 0 4px #e8c860,6px 6px #0005;padding:22px}
.box h2{font-size:15px;line-height:22px;color:#e52521;margin-bottom:14px}.box p{font-size:11px;line-height:20px}
.hd{position:absolute;left:60px;top:16px;font-size:12px;text-shadow:3px 3px #000;line-height:20px}.hd b{color:#f8d818;font-size:16px}
.vis{position:absolute;left:575px;top:105px;width:345px;height:300px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;align-content:center}
.ic{width:100px;background:#000a;border:4px solid #fff;padding:10px 4px;text-align:center;font-size:8px;line-height:12px;animation:fl 1.4s ease-in-out infinite}.ic i{display:block;font-style:normal;font-size:38px;margin-bottom:8px}.ic:nth-child(2){animation-delay:.3s}.ic:nth-child(3){animation-delay:.6s}
@keyframes fl{50%{transform:translateY(-10px)}}
.nav{position:absolute;left:30px;right:30px;bottom:22px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.nav .btn{font-size:11px;padding:10px 12px}.dots{font-size:14px;letter-spacing:4px;text-shadow:2px 2px #000}
.wk{animation:wk linear infinite}@keyframes wk{from{left:-80px}to{left:1040px}}
.sw{animation:wk linear infinite}
.bub{position:absolute;bottom:-20px;width:12px;height:12px;border:3px solid #cfe;border-radius:50%;animation:bu 6s linear infinite}@keyframes bu{to{bottom:560px}}
.pipe{position:absolute;bottom:90px;width:70px;background:#1ea81e;border:4px solid #000;box-shadow:inset 10px 0 #5fe05f,inset -10px 0 #0a6a0a}.pipe:before{content:"";position:absolute;left:-10px;right:-10px;top:-4px;height:26px;background:#1ea81e;border:4px solid #000;box-shadow:inset 10px 0 #5fe05f,inset -10px 0 #0a6a0a}
/* castle */
.brk{position:absolute;inset:0;background:linear-gradient(#0004,#0004),repeating-linear-gradient(90deg,#3a3a4a 0 3px,transparent 3px 60px),repeating-linear-gradient(#3a3a4a 0 3px,#585868 3px 40px);background-color:#585868}
.lava{position:absolute;left:0;right:0;bottom:0;height:70px;background:repeating-linear-gradient(90deg,#f83800 0 20px,#f89818 20px 40px);animation:lv .8s steps(2) infinite}@keyframes lv{50%{background-position:20px 0}}
.brg{position:absolute;bottom:70px;height:30px;background:repeating-linear-gradient(90deg,#bbb 0 28px,#777 28px 32px);border-top:5px solid #eee;transition:transform 1.4s}
.pod{position:absolute;bottom:60px;width:20px;height:24px;background:#f87800;border-radius:50% 50% 30% 30%;animation:pd 2.4s ease-out infinite}@keyframes pd{0%{transform:translateY(0)}45%{transform:translateY(-300px)}90%,100%{transform:translateY(0)}}
.torch{position:absolute;font-size:30px;animation:fl .5s steps(2) infinite}
.qc{position:absolute;left:130px;top:52px;width:700px;background:#14142a;border:5px solid #fff;box-shadow:6px 6px #0008;padding:16px}
.qc .st{font-size:9px;color:#f8d818;margin-bottom:10px;display:flex;justify-content:space-between}.qc h3{font-size:12px;line-height:20px;margin-bottom:12px}
.op{display:grid;grid-template-columns:1fr 1fr;gap:10px}.op button{font:inherit;font-size:9px;line-height:15px;text-align:left;padding:9px;background:#2038ec;color:#fff;border:3px solid #fff;cursor:pointer;min-height:56px}
.op button:hover{background:#4a60ff}.op button.ok{background:#18a818}.op button.no{background:#c01818;opacity:.6}
.msg{font-size:9px;line-height:15px;margin-top:10px;min-height:30px;color:#f8d818}
.shk{animation:sk .4s}@keyframes sk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#bw{transition:transform 1.6s ease-in,opacity 1.6s}#bw.fall{transform:translateY(300px) rotate(140deg);opacity:0}
.fim{position:absolute;left:210px;top:70px;width:540px;background:#14142aee;border:5px solid #fff;padding:24px;text-align:center;display:none;z-index:6}.fim.show{display:block}
.fim p{font-size:9px;line-height:17px;margin:8px 0}
@media (orientation:portrait){#rot{display:flex}}#rot{display:none;position:fixed;left:0;right:0;top:0;padding:8px;background:#e52521;color:#fff;font-size:9px;text-align:center;z-index:99}
</style></head><body>
